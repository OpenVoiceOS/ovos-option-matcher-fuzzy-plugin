[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-option-matcher-fuzzy-plugin"
dynamic = ["version"]
description = "Fuzzy-match OptionMatcher agent plugin for OpenVoiceOS"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "OpenVoiceOS", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.10"
keywords = ["OVOS", "openvoiceos", "plugin", "option-matcher", "fuzzy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "ovos-plugin-manager>=2.4.0a1,<3.0.0",
    "ovos-utils>=0.8.0",
    "langcodes>=3.0.0",
    "rapidfuzz",
    "ovos-number-parser>=0.0.1,<1.0.0",
]

[project.optional-dependencies]
number-parser = ["ovos-number-parser>=0.0.1,<1.0.0"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-option-matcher-fuzzy-plugin"
Repository = "https://github.com/OpenVoiceOS/ovos-option-matcher-fuzzy-plugin"

[project.entry-points."opm.agents.option_matcher"]
ovos-option-matcher-fuzzy-plugin = "ovos_option_matcher_fuzzy:FuzzyOptionMatcherPlugin"

[tool.setuptools.packages.find]
include = ["ovos_option_matcher_fuzzy*"]

[tool.setuptools.package-data]
"*" = ["locale/**/*.voc"]

[tool.setuptools.dynamic]
version = {attr = "ovos_option_matcher_fuzzy.version.__version__"}
