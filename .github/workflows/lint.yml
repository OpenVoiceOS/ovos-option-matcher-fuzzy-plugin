name: Lint

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  lint:
    uses: OpenVoiceOS/gh-automations/.github/workflows/lint.yml@fa39846b074ac7a856c8af5f8c0dec12b1fff1aa
    secrets: inherit
    with:
      ruff: true
      pre_commit: false   # set true if .pre-commit-config.yaml exists
